
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: examen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: examen_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_examen
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == instance-20261005-2053
      restart_policy:
        condition: on-failure

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - red_examen
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

volumes:
  postgres_data:

networks:
  red_examen:
    driver: overlay
