
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: examen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: examen_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_examen
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == instance-20261005-2053

  adminer:
    image: adminer:latest
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host
    networks:
      - red_examen
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == instance-20261005-2053

  flask:
    image: ${FLASK_IMAGE:-saulinho8428/cn2-u3-flask:1.0}
    ports:
      - target: 5000
        published: 5003
        protocol: tcp
        mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - red_examen
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == instance-20260930-1814
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:

networks:
  red_examen:
    driver: overlay
